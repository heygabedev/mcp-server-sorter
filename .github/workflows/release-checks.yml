name: Release checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.9"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: uv sync --frozen --python 3.13
      - run: npm ci --prefix web
      - run: uv run pytest --cov=mcp_sorter --cov-report=json
      - run: uv run python scripts/check_coverage.py
      - run: uv run python scripts/mutation_check.py
      - run: uv run python scripts/benchmark.py
      - run: uv run pip-audit --format=json --output=dist/python-audit.json
      - run: npm audit --prefix web --audit-level=low
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-acceptance
          path: |
            coverage.json
            dist/*report.json
            dist/benchmark.json
            dist/python-audit.json
